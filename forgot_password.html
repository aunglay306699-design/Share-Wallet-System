<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>စကားဝှက်အသစ်တောင်းခံရန်</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 5px;
        }
        input[type="email"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #6200ee;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #3700b3;
        }
        .back-to-login {
            margin-top: 15px;
            display: block;
            color: #6200ee;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>စကားဝှက်မေ့နေပါသလား?</h2>
        <p>သင့်အကောင့်ဖွင့်ထားသော Email လိပ်စာကို ထည့်ပါ။ စကားဝှက်အသစ်ပြောင်းရန် လင့်ခ်ကို ပို့ပေးပါမည်။</p>
        
        <form onsubmit="resetPassword(event)">
            <div class="input-group">
                <label for="email">အီးမေးလ် (Email)</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>
            
            <button type="submit">လင့်ခ်ပို့ရန် (Send Reset Link)</button>
        </form>

        <a href="index.html" class="back-to-login">← Login စာမျက်နှာသို့ ပြန်သွားရန်</a>
    </div>

    <script type="module">
        import { 
            auth, 
            sendPasswordResetEmail 
        } from "./firebase-config.js";

        // Reset Password လုပ်ဆောင်သည့် Function
        window.resetPassword = function(event) {
            event.preventDefault(); // Form ပုံမှန် Refresh ဖြစ်သွားတာကို တားဆီးသည်
            const email = document.getElementById('email').value.trim();

            if (!email) {
                alert("ကျေးဇူးပြု၍ Email ထည့်ပါ။");
                return;
            }

            sendPasswordResetEmail(auth, email)
                .then(() => {
                    alert("စကားဝှက်အသစ်ပြောင်းရန် လင့်ခ်ကို သင့် Email သို့ ပို့လိုက်ပါပြီ။ ကျေးဇူးပြု၍ Email ကို စစ်ဆေးပါ။");
                    window.location.href = "index.html"; // Login စာမျက်နှာသို့ ပြန်ပို့မည်
                })
                .catch((error) => {
                    console.error(error);
                    alert("Error: " + error.message);
                });
        }
    </script>
</body>
</html>
